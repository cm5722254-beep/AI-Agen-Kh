name: khmer_ai_agent
description: "Khmer AI Coding Agent - Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & networking
  http: ^1.2.0
  dio: ^5.4.0

  # State management
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  # UI
  google_fonts: ^6.1.0
  flutter_markdown: ^0.6.18
  flutter_syntax_view: ^4.1.1
  lottie: ^3.0.0
  shimmer: ^3.0.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  url_launcher: ^6.2.4
  path_provider: ^2.1.2
  file_picker: ^8.0.3

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/NotoSansKhmer-Regular.ttf
        - asset: assets/fonts/NotoSansKhmer-Bold.ttf
          weight: 700
